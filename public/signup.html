<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Coupling</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="theme-toggle">
        <button id="themeToggle" aria-label="Toggle theme">
            <span class="theme-icon">🌙</span>
        </button>
    </div>

    <div class="signup-container">
        <div class="signup-content">
            <h1 class="logo">Coupling</h1>
            <h2>Create Your Account</h2>

            <form id="signupForm" class="signup-form">
                <div class="form-section">
                    <h3>Basic Information</h3>
                    <div class="form-group">
                        <input type="text" id="name" placeholder="Full Name" required>
                    </div>
                    <div class="form-group">
                        <input type="email" id="email" placeholder="Email" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="password" placeholder="Password" required minlength="6">
                    </div>
                </div>

                <div class="form-section">
                    <h3>Education</h3>
                    <div class="form-group">
                        <select id="country" required>
                            <option value="">Select Country</option>
                            <option value="United States">United States</option>
                            <option value="United Kingdom">United Kingdom</option>
                            <option value="Canada">Canada</option>
                            <option value="Australia">Australia</option>
                            <option value="Germany">Germany</option>
                            <option value="France">France</option>
                            <option value="India">India</option>
                            <option value="China">China</option>
                            <option value="Japan">Japan</option>
                            <option value="South Korea">South Korea</option>
                            <option value="Singapore">Singapore</option>
                            <option value="Netherlands">Netherlands</option>
                            <option value="Sweden">Sweden</option>
                            <option value="Switzerland">Switzerland</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <input type="text" id="university" placeholder="University Name" required>
                    </div>
                </div>

                <div class="form-section">
                    <h3>Your Role</h3>
                    <div class="user-type-selection">
                        <label class="user-type-card">
                            <input type="radio" name="userType" value="technical" required>
                            <div class="card-content">
                                <div class="card-icon">⚙️</div>
                                <h4>Technical</h4>
                                <p>I can build and develop projects</p>
                            </div>
                        </label>
                        <label class="user-type-card">
                            <input type="radio" name="userType" value="non-technical" required>
                            <div class="card-content">
                                <div class="card-icon">💡</div>
                                <h4>Non-Technical</h4>
                                <p>I have ideas and need technical help</p>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="form-section" id="technicalFields" style="display: none;">
                    <h3>Technical Profile</h3>
                    <div class="form-group">
                        <textarea id="skills" placeholder="Your skills (e.g., React, Python, iOS Development)" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <textarea id="bio" placeholder="Tell us about yourself and what you're looking for" rows="3"></textarea>
                    </div>
                </div>

                <div class="form-section" id="nonTechnicalFields" style="display: none;">
                    <h3>Project Details</h3>
                    <div class="form-group">
                        <textarea id="projectIdea" placeholder="Describe your project idea" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <input type="text" id="timeline" placeholder="Expected timeline (e.g., 3 months)">
                    </div>
                    <div class="form-group">
                        <input type="text" id="equityOffer" placeholder="Equity offer or compensation (e.g., 10% equity, $500)">
                    </div>
                    <div class="form-group">
                        <textarea id="bioNonTech" placeholder="Tell us about yourself" rows="3"></textarea>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Create Account</button>
                <div class="error-message" id="errorMessage"></div>
            </form>

            <p class="auth-switch">
                Already have an account? <a href="/">Sign In</a>
            </p>
        </div>
    </div>

    <script src="signup.js"></script>
</body>
</html>
