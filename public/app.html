<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coupling - Find Your Match</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1 class="logo">Coupling</h1>
            <div class="header-actions">
                <div class="theme-toggle">
                    <button id="themeToggle" aria-label="Toggle theme">
                        <span class="theme-icon">🌙</span>
                    </button>
                </div>
                <button id="viewMatches" class="btn btn-secondary">Matches</button>
                <button id="signoutBtn" class="btn btn-tertiary">Sign Out</button>
            </div>
        </header>

        <main class="app-main">
            <div id="swipeView" class="swipe-view">
                <div id="cardStack" class="card-stack">
                    <div id="noMoreCards" class="no-more-cards" style="display: none;">
                        <div class="icon">🎉</div>
                        <h2>No more profiles</h2>
                        <p>Check back later for new matches!</p>
                    </div>
                </div>

                <div class="swipe-actions">
                    <button id="passBtn" class="action-btn pass-btn" aria-label="Pass">
                        <span>✕</span>
                    </button>
                    <button id="likeBtn" class="action-btn like-btn" aria-label="Like">
                        <span>♥</span>
                    </button>
                </div>
            </div>

            <div id="matchesView" class="matches-view" style="display: none;">
                <div class="matches-header">
                    <button id="backToSwipe" class="btn btn-secondary">← Back to Swiping</button>
                    <h2>Your Matches</h2>
                </div>
                <div id="matchesList" class="matches-list">
                    <!-- Matches will be populated here -->
                </div>
            </div>
        </main>

        <div id="matchModal" class="modal" style="display: none;">
            <div class="modal-content match-modal">
                <div class="match-animation">
                    <h2>It's a Match! 🎉</h2>
                    <p>You and <span id="matchName"></span> both liked each other!</p>
                    <button id="closeMatchModal" class="btn btn-primary">Continue Swiping</button>
                    <button id="viewAllMatches" class="btn btn-secondary">View Matches</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
